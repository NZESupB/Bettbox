name: build

on:
  push:
    tags:
      - 'v*'

env:
  IS_STABLE: ${{ !contains(github.ref, '-') }}
  IS_PRERELEASE: ${{ contains(github.ref_name, 'pre') }}
  SHOULD_RELEASE: ${{ !contains(github.ref, '-') || contains(github.ref_name, 'pre') }}
  GRADLE_OPTS: -Dorg.gradle.vfs.watch=false
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SENTRY_BACKEND: none
  SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
  IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN || vars.IPINFO_TOKEN }}
  
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-24.04
            arch: arm64
          - platform: android
            os: ubuntu-24.04
            arch: amd64
          - platform: android
            os: ubuntu-24.04
            arch: arm
          - platform: android
            os: ubuntu-24.04
            arch: universal
          - platform: windows
            os: windows-2022
            arch: amd64
          - platform: windows
            os: windows-11-arm
            arch: arm64
          - platform: windows
            os: windows-2022
            arch: amd64
            compatible: true
          - platform: macos
            os: macos-15
            arch: arm64
          - platform: macos
            os: macos-15
            arch: amd64
          - platform: macos
            os: macos-15
            arch: amd64
            compatible: true
          - platform: linux
            os: ubuntu-22.04
            arch: amd64
          - platform: linux
            os: ubuntu-24.04-arm
            arch: arm64
          - platform: linux
            os: ubuntu-22.04
            arch: amd64
            compatible: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Free disk space (Android)
        if: matrix.platform == 'android'
        shell: bash
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf /usr/local/lib/android/sdk/system-images
          sudo rm -rf /usr/local/lib/android/sdk/emulator
          sudo rm -rf /usr/local/lib/android/sdk/ndk/*
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h /

      - name: Setup Rust (Windows)
        if: matrix.platform == 'windows'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch == 'arm64' && 'aarch64-pc-windows-msvc' || 'x86_64-pc-windows-msvc' }}

      - name: Setup Rust (Android)
        if: matrix.platform == 'android'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Setup Rust (Linux)
        if: matrix.platform == 'linux'
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust (macOS)
        if: matrix.platform == 'macos'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch == 'amd64' && 'x86_64-apple-darwin' || 'aarch64-apple-darwin' }}

      - name: Enable Git long paths (Windows)
        if: matrix.platform == 'windows'
        run: git config --global core.longpaths true

      - name: Setup Java (Android)
        if: matrix.platform == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 必须排在 Setup Java 之后：这里要用 JDK 当场校验 keystore，否则坏 keystore
      # 要等到七分钟后的 Gradle 打包阶段才暴露成
      # `KeytoolException: Failed to read key ... Tag number over 30 is not supported`。
      - name: Setup Keystore (Android)
        if: matrix.platform == 'android'
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          missing=''
          [ -n "$KEYSTORE_B64" ]   || missing="$missing KEYSTORE"
          [ -n "$KEY_ALIAS" ]      || missing="$missing KEY_ALIAS"
          [ -n "$STORE_PASSWORD" ] || missing="$missing STORE_PASSWORD"
          [ -n "$KEY_PASSWORD" ]   || missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::缺少 Android 签名 Secrets:$missing"
            exit 1
          fi

          keystore='android/app/keystore.jks'
          # 先剥掉所有空白再解码：兼容换行包装的 base64 与粘贴引入的空格/CR。
          if ! printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' \
               | base64 --decode > "$keystore" 2>base64.err; then
            echo "::error::KEYSTORE secret 不是合法 base64，无法解码"
            cat base64.err
            exit 1
          fi

          size=$(wc -c < "$keystore")
          echo "keystore 解码完成：${size} bytes"

          # 用与 AGP 完全一致的 JDK API 校验：KeyStore.load(storePassword) +
          # getEntry(alias, keyPassword)。keytool CLI 对 PKCS12 会在 -keypass
          # 失败时回退到 store 密码，校验不出 key 密码错误，因此不能用它。
          cat > /tmp/KeystoreProbe.java <<'JAVA'
          import java.io.FileInputStream;
          import java.security.KeyStore;

          public class KeystoreProbe {
              public static void main(String[] args) throws Exception {
                  KeyStore ks = KeyStore.getInstance(KeyStore.getDefaultType());
                  try (FileInputStream in = new FileInputStream(System.getenv("KEYSTORE_PATH"))) {
                      ks.load(in, System.getenv("STORE_PASSWORD").toCharArray());
                  }
                  String alias = System.getenv("KEY_ALIAS");
                  if (!ks.containsAlias(alias)) {
                      throw new IllegalStateException("keystore 中不存在 alias: " + alias);
                  }
                  KeyStore.Entry entry = ks.getEntry(alias,
                      new KeyStore.PasswordProtection(System.getenv("KEY_PASSWORD").toCharArray()));
                  if (!(entry instanceof KeyStore.PrivateKeyEntry)) {
                      throw new IllegalStateException("alias 不是私钥条目: " + alias);
                  }
                  System.out.println("keystore 校验通过：type=" + ks.getType() + " alias=" + alias);
              }
          }
          JAVA

          if ! KEYSTORE_PATH="$keystore" java /tmp/KeystoreProbe.java > probe.log 2>&1; then
            echo '--- 校验输出 ---'
            cat probe.log
            header=$(head -c 4 "$keystore" | od -An -tx1 | tr -d ' \n')
            echo "--- 文件头 4 字节: ${header:-<空文件>} ---"
            case "$header" in
              3082*|feedfeed)
                echo "::error::keystore 文件本身合法，但 STORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD 中至少一项不匹配"
                ;;
              *)
                echo "::error::KEYSTORE secret 解码后不是 keystore（应以 30 82 开头表示 PKCS12，或 fe ed fe ed 表示 JKS）"
                echo '请重新生成该 secret：'
                echo '  Linux: base64 -w 0 keystore.jks'
                echo '  macOS: base64 -i keystore.jks | tr -d "\n"'
                ;;
            esac
            exit 1
          fi
          cat probe.log
          rm -f probe.log base64.err /tmp/KeystoreProbe.java

          {
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } >> android/local.properties

      - name: Setup Android NDK
        if: matrix.platform == 'android'
        shell: bash
        run: |
          NDK_VERSION="28.2.13676358"
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" >/dev/null 2>&1 || true
          echo "ANDROID_NDK=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Configure Cargo for Android
        if: matrix.platform == 'android'
        shell: bash
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml <<EOF
          [target.aarch64-linux-android]
          linker = "${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          [target.armv7-linux-androideabi]
          linker = "${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi26-clang"
          [target.x86_64-linux-android]
          linker = "${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android26-clang"
          [target.i686-linux-android]
          linker = "${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/i686-linux-android26-clang"
          EOF

      - name: Install Dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::ForceIPv4=true
          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::ForceIPv4=true --fix-missing libcurl4-openssl-dev ninja-build libgtk-3-dev rpm

      - name: Setup Golang
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.compatible == true && '1.20.x' || '1.25.x' }}
          cache-dependency-path: core/go.sum
          cache: ${{ matrix.platform != 'android' }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ contains(matrix.os, 'arm') && 'master' || 'stable' }}
          cache: ${{ matrix.platform != 'android' }}
          cache-key: flutter-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('**/pubspec.lock') }}
          flutter-version: ${{ contains(matrix.os, 'arm') && '' || '3.44.9' }}


      - name: Clean Gradle (Android)
        if: matrix.platform == 'android'
        run: |
          cd android
          flutter clean

      - name: Disable Swift Package Manager (macOS)
        if: matrix.platform == 'macos'
        run: flutter config --no-enable-swift-package-manager

      - name: Patch for Windows
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          cd core
          SING_TUN_VERSION=$(grep -E 'github\.com/metacubex/sing-tun\s+v[^[:space:]]+' go.mod | awk '{print $2}')
          echo "Detected sing-tun version: ${SING_TUN_VERSION}"
          go mod download github.com/metacubex/sing-tun@${SING_TUN_VERSION}
          MOD_CACHE=$(go env GOMODCACHE | tr '\\' '/')
          FILE="${MOD_CACHE}/github.com/metacubex/sing-tun@${SING_TUN_VERSION}/tun_windows.go"
          echo "Patching ${FILE}"
          chmod +w "${FILE}"
      - name: Build KitonyBox (Non-Windows)
        if: matrix.platform != 'windows'
        shell: bash
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          flutter pub get
          dart run build_runner build -d
          dart setup.dart ${{ matrix.platform }} --arch ${{ matrix.arch }} ${{ env.IS_STABLE == 'true' && '--env stable' || '' }} ${{ matrix.compatible == true && '--compatible' || '' }}

      - name: Install SignPath (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if (-not $env:SIGNPATH_API_TOKEN) {
            Write-Host "SIGNPATH_API_TOKEN is not configured. Skipping module installation."
            exit 0
          }
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Set-PSRepository -Name 'PSGallery' -InstallationPolicy Trusted
          Install-Module -Name SignPath -Force -Scope CurrentUser -Repository PSGallery

      - name: Set Signing Policy Slug (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $isStable = '${{ env.IS_STABLE }}' -eq 'true'
          $isPre = '${{ env.IS_PRERELEASE }}' -eq 'true'

          if ($isStable) {
            $exePolicy = "release-signing"
            $installerPolicy = "release-signing"
          } elseif ($isPre) {
            $exePolicy = "test-signing"
            $installerPolicy = "release-signing"
          } else {
            $exePolicy = "test-signing"
            $installerPolicy = "test-signing"
          }
          Write-Host "Setting EXE_SIGNING_POLICY_SLUG to $exePolicy"
          Write-Host "Setting INSTALLER_SIGNING_POLICY_SLUG to $installerPolicy"
          "EXE_SIGNING_POLICY_SLUG=$exePolicy" | Out-File -FilePath $env:GITHUB_ENV -Append
          "INSTALLER_SIGNING_POLICY_SLUG=$installerPolicy" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Core (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          flutter pub get
          dart run build_runner build -d
          dart setup.dart windows --arch ${{ matrix.arch }} --out core-only ${{ matrix.compatible == true && '--compatible' || '' }}

      - name: Upload Unsigned Core
        if: matrix.platform == 'windows' && env.SIGNPATH_API_TOKEN != ''
        id: upload-core
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-core-${{ matrix.arch }}-${{ matrix.compatible }}
          path: libclash/windows/KitonyBoxCore.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign Core (Windows)
        if: matrix.platform == 'windows' && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v2
        timeout-minutes: 60
        with:
          api-token: '${{ env.SIGNPATH_API_TOKEN }}'
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          organization-id: '0d3f8e8e-3f4d-4ac8-ab3f-d6c5c110ab0d'
          project-slug: 'Bettbox'
          signing-policy-slug: '${{ env.EXE_SIGNING_POLICY_SLUG }}'
          github-artifact-id: '${{ steps.upload-core.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'libclash/windows'

      - name: Build HelperService (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $signedCoreHash = (Get-FileHash libclash/windows/KitonyBoxCore.exe -Algorithm SHA256).Hash.ToLower()
          Write-Host "Signed Core SHA256 (TOKEN for Helper): $signedCoreHash"
          dart setup.dart windows --arch ${{ matrix.arch }} --out helper --core-hash $signedCoreHash ${{ matrix.compatible == true && '--compatible' || '' }}

      - name: Upload Unsigned HelperService
        if: matrix.platform == 'windows' && env.SIGNPATH_API_TOKEN != ''
        id: upload-helper
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-helper-${{ matrix.arch }}-${{ matrix.compatible }}
          path: libclash/windows/KitonyBoxHelperService.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign HelperService (Windows)
        if: matrix.platform == 'windows' && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v2
        timeout-minutes: 60
        with:
          api-token: '${{ env.SIGNPATH_API_TOKEN }}'
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          organization-id: '0d3f8e8e-3f4d-4ac8-ab3f-d6c5c110ab0d'
          project-slug: 'Bettbox'
          signing-policy-slug: '${{ env.EXE_SIGNING_POLICY_SLUG }}'
          github-artifact-id: '${{ steps.upload-helper.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'libclash/windows'

      - name: Build KitonyBox (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          $coreHash = (Get-FileHash libclash/windows/KitonyBoxCore.exe -Algorithm SHA256).Hash.ToLower()
          Write-Host "Core SHA256: $coreHash"
          
          $desc = if ('${{ matrix.compatible }}' -eq 'true') { "${{ matrix.arch }}-compatible" } else { "${{ matrix.arch }}" }
          $appEnv = if ('${{ env.IS_STABLE }}' -eq 'true') { "stable" } else { "pre" }
          
          $flutterArgs = @(
            "build", "windows", "--release", "--verbose",
            "--dart-define=CORE_SHA256=$coreHash",
            "--dart-define=APP_ENV=$appEnv",
            "--dart-define=APP_ASSET_SUFFIX=windows-$desc-setup.exe"
          )
          if ($env:SENTRY_DSN) {
            $flutterArgs += "--dart-define=SENTRY_DSN=$env:SENTRY_DSN"
          }
          if ($env:IPINFO_TOKEN) {
            $flutterArgs += "--dart-define=IPINFO_TOKEN=$env:IPINFO_TOKEN"
          }
          
          flutter @flutterArgs

      - name: Upload Unsigned KitonyBox
        if: matrix.platform == 'windows' && env.SIGNPATH_API_TOKEN != ''
        id: upload-kitonybox
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-kitonybox-${{ matrix.arch }}-${{ matrix.compatible }}
          path: build/windows/${{ matrix.arch == 'arm64' && 'arm64' || 'x64' }}/runner/Release/KitonyBox.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign KitonyBox (Windows)
        if: matrix.platform == 'windows' && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v2
        timeout-minutes: 60
        with:
          api-token: '${{ env.SIGNPATH_API_TOKEN }}'
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          organization-id: '0d3f8e8e-3f4d-4ac8-ab3f-d6c5c110ab0d'
          project-slug: 'Bettbox'
          signing-policy-slug: '${{ env.EXE_SIGNING_POLICY_SLUG }}'
          github-artifact-id: '${{ steps.upload-kitonybox.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'build/windows/${{ matrix.arch == ''arm64'' && ''arm64'' || ''x64'' }}/runner/Release'

      - name: Package Windows Application
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          dart windows/packaging/exe/package_windows.dart --arch ${{ matrix.arch }} ${{ matrix.compatible == true && '--compatible' || '' }} --env ${{ env.IS_STABLE == 'true' && 'stable' || 'pre' }}

      - name: Find Installer Path
        if: matrix.platform == 'windows' && env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          $desc = if ('${{ matrix.compatible }}' -eq 'true') { "${{ matrix.arch }}-compatible" } else { "${{ matrix.arch }}" }
          $installer = (Resolve-Path "dist/KitonyBox-*-windows-$desc-setup.exe").Path
          echo "INSTALLER_PATH=$installer" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "INSTALLER_FILENAME=$(Split-Path -Leaf $installer)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload Unsigned Installer
        if: matrix.platform == 'windows' && env.SIGNPATH_API_TOKEN != ''
        id: upload-installer
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installer-${{ matrix.arch }}-${{ matrix.compatible }}
          path: ${{ env.INSTALLER_PATH }}
          if-no-files-found: error
          retention-days: 1

      - name: Sign Installer (Windows)
        if: matrix.platform == 'windows' && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v2
        timeout-minutes: 60
        with:
          api-token: '${{ env.SIGNPATH_API_TOKEN }}'
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          organization-id: '0d3f8e8e-3f4d-4ac8-ab3f-d6c5c110ab0d'
          project-slug: 'Bettbox'
          signing-policy-slug: '${{ env.INSTALLER_SIGNING_POLICY_SLUG }}'
          github-artifact-id: '${{ steps.upload-installer.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'dist'
      
      - name: Clean up intermediate unsigned artifacts
        if: always() && matrix.platform == 'windows' && env.SIGNPATH_API_TOKEN != ''
        uses: geekyeggo/delete-artifact@v6
        with:
          name: |
            unsigned-core-${{ matrix.arch }}-${{ matrix.compatible }}
            unsigned-helper-${{ matrix.arch }}-${{ matrix.compatible }}
            unsigned-kitonybox-${{ matrix.arch }}-${{ matrix.compatible }}
            unsigned-installer-${{ matrix.arch }}-${{ matrix.compatible }}
          failOnError: false
      
      - name: Verify Core Permissions (Linux)
        if: matrix.platform == 'linux' && matrix.compatible != true
        shell: bash
        run: |
          echo "=== Verifying KitonyBoxCore setuid in DEB package ==="
          if ls dist/KitonyBox-*.deb 1>/dev/null 2>&1; then
            DEB_PERMS=$(dpkg-deb -c dist/KitonyBox-*.deb | grep KitonyBoxCore || true)
            echo "$DEB_PERMS"
            if echo "$DEB_PERMS" | grep -q 'rws'; then
              echo "OK: KitonyBoxCore in DEB has setuid bit"
            else
              echo "WARNING: KitonyBoxCore in DEB is missing setuid bit (will be set by postinst on install)"
              POSTINST=$(dpkg-deb -e dist/KitonyBox-*.deb /tmp/kitonybox-deb-control && cat /tmp/kitonybox-deb-control/postinst || true)
              if ! echo "$POSTINST" | grep -q '/usr/share/KitonyBox/KitonyBoxCore'; then
                echo "ERROR: postinst script does not set permissions on /usr/share/KitonyBox/KitonyBoxCore"
                exit 1
              fi
            fi
          fi
          echo "=== Verifying KitonyBoxCore setuid in RPM package ==="
          if ls dist/KitonyBox-*.rpm 1>/dev/null 2>&1; then
            RPM_PERMS=$(rpm -qplv dist/KitonyBox-*.rpm | grep KitonyBoxCore || true)
            echo "$RPM_PERMS"
            if ! echo "$RPM_PERMS" | grep -q 'rws'; then
              echo "ERROR: KitonyBoxCore in RPM is missing setuid bit"
              exit 1
            fi
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: KitonyBox-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.compatible == true && '-compatible' || '' }}
          path: ./dist
          compression-level: 9
          overwrite: true

  upload:
    permissions: write-all
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download
        uses: actions/download-artifact@v8
        with:
          path: ./dist/
          pattern: KitonyBox-*
          merge-multiple: true

      - name: Generate release.md
        run: |
          printf '%s\n' "- Fixes and improvements" "- Recommended version update" > release.md

      - name: Patch release.md
        run: |
          version=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          base_version=$(echo "$version" | sed 's/-pre[0-9]*//')
          if [ "${{ env.IS_PRERELEASE }}" == "true" ]; then
            sed -e "s|BASE_VERSION|$base_version|g" -e "s|VERSION|$version|g" ./.github/release_template_pre.md >> release.md
          else
            sed -e "s|BASE_VERSION|$base_version|g" -e "s|VERSION|$version|g" ./.github/release_template.md >> release.md
          fi

      - name: Release
        if: ${{ env.SHOULD_RELEASE == 'true' }}
        uses: softprops/action-gh-release@v3.0.0
        with:
          files: ./dist/*
          body_path: './release.md'
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
